name: Bug Report
description: Report a bug in Dojo
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can the issue be reproduced? Please provide clear steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including any error output or tracebacks.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Python version:
        - Dojo version (`dojo version`):
        - Pandoc version (`pandoc --version`):
        - Ninja version (`ninja --version`):
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: dojo.yaml configuration
      description: Relevant parts of your `dojo.yaml` configuration.
      render: yaml
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context or screenshots about the bug report here.
