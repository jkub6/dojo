name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - name: Cache Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # Save one archive per environment; source-only changes reuse it without uploading.
          primary-key: nix-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.lock', 'flake.nix',
            'nix/**/*.nix', 'pyproject.toml', '.github/workflows/ci.yml') }}
      - name: CI
        run: nix develop --command just ci
