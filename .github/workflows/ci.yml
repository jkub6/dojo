name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: uses/nix-action@v2
      with:
        nix_path: nixpkgs=channel:nixos-unstable
    
    - name: Static Analysis
      run: nix develop --command bash -c "just check"

    - name: Run Tests
      run: nix develop --command bash -c "just test"
