[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dojo-ssg"
version = "0.1.0"
description = "A static site and document generator powered by Ninja and Pandoc"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Jake", email = "jkub66@gmail.com" }]
keywords = [
  "ninja",
  "pandoc",
  "ssg",
  "static-site-generator",
  "build-tool",
  "typst",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Text Processing :: Markup",
  "Typing :: Typed",
]
dependencies = [
  "pyyaml>=6.0.2",
  "pydantic>=2.10",
  "tqdm>=4.67",
  "rich>=14.0",
  "zstandard>=0.23",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "pytest-randomly",
  "pytest-timeout",
  "pytest-mock",
  "pytest-regressions",
  "hypothesis",
  "mypy",
  "types-PyYAML",
  "vulture",
  "jsonschema",
]

[project.urls]
Homepage = "https://github.com/jkub6/dojo"
Documentation = "https://github.com/jkub6/dojo#readme"
Repository = "https://github.com/jkub6/dojo.git"
Issues = "https://github.com/jkub6/dojo/issues"
Changelog = "https://github.com/jkub6/dojo/blob/main/CHANGELOG.md"

[project.scripts]
dojo = "dojo.cli:entry_point"

[tool.hatch.build.targets.wheel]
packages = ["src/dojo"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = [
  "F",     # Pyflakes (logic errors)
  "E",     # pycodestyle (style)
  "W",     # pycodestyle (warnings)
  "I",     # isort (imports)
  "N",     # pep8-naming (class/function names)
  "B",     # flake8-bugbear (likely bugs/design problems)
  "A",     # flake8-builtins (shadowing builtins)
  "C4",    # flake8-comprehensions (better list/dict comps)
  "DTZ",   # flake8-datetimez (require timezone-aware dates)
  "SIM",   # flake8-simplify (suggestions for simpler code)
  "T20",   # flake8-print (disallow print, prefer logging)
  "RUF",   # Ruff-specific rules
  "ERA",   # eradicate (ban commented out code)
  "PL",    # Pylint (static analysis)
  "S",     # Bandit (Security)
  "UP",    # pyupgrade (Modernize syntax)
  "D",     # pydocstyle (Docstrings)
  "PT",    # flake8-pytest-style (Test best practices)
  "C90",   # McCabe (Complexity check)
  "ANN",   # Enforce Type Hints (Strict!)
  "TRY",   # Exception handling anti-patterns
  "BLE",   # Ban blind exceptions (except Exception:)
  "PERF",  # Performance anti-patterns
  "LOG",   # Logging best practices
  "RET",   # Return value consistency
  "TCH",   # Type-checking blocks (Move imports under IF TYPE_CHECKING)
  "ARG",   # Unused arguments (strict)
  "TID",   # flake8-tidy-imports
  "FBT",   # Boolean trap
  "G",     # Logging format
  "FA",    # flake8-future-annotations (enforce __future__ annotations)
  "PIE",   # flake8-pie (clean code practices)
  "RSE",   # flake8-raise (clean exception raises)
  "SLOT",  # flake8-slots (require __slots__ where appropriate)
  "PGH",   # pygrep-hooks (ban generic ignores/eval)
  "FLY",   # flynt (f-strings)
  "YTT",   # flake8-2020 (Python 2/3 version checks)
  "ASYNC", # flake8-async (async best practices)
  "FURB",  # refurb (modernizing Python idioms)
  "PTH",   # flake8-use-pathlib (enforce pathlib)
  "PYI",   # flake8-pyi (type stubs and typing practices)
  "EM",    # flake8-errmsg (format error messages)
  "ICN",   # flake8-import-conventions (import aliases)
  "SLF",   # flake8-self (private member access)
]
ignore = [
  "E501",   # Line too long (handled by formatter)
  "D203",   # One blank line before class (conflicts with D211)
  "D213",   # Multi-line docstring summary at second line (conflicts with D212)
  "ISC001", # Implicit string concatenation (conflicts with formatter)
  "COM812", # Missing trailing comma (conflicts with formatter)
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
# Test code is allowed to:
# - S101: Use assert statements
# - S311: Standard pseudo-random generators (deterministic test data)
# - ARG001, ARG002: Unused arguments (pytest fixtures)
# - S603: Use subprocess without shell=False validation
# - S607: Starting process with partial executable path (e.g., "ninja")
# - SLF001: Access private members (unit test inspection)
# - ANN: Function annotations (not required on test functions)
# - D100..D104: Doc strings (not required on all test functions)
# - PLR2004: Magic value used in comparison (status codes, counts in tests)
"tests/**/*.py" = [
  "S101",
  "S311",
  "ARG001",
  "ARG002",
  "S603",
  "S607",
  "SLF001",
  "ANN",
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "PLR2004",
]

"src/dojo/emitter.py" = [
  "PLR0913",
] # Ninja build format has many optional fields

"src/dojo/plugins.py" = [
  "ARG002",
] # Base interface methods define standard arguments for subclasses


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = ["--strict-markers", "--strict-config", "--tb=short"]
timeout = 30
pythonpath = "src"

[tool.mypy]
files = "src"
python_version = "3.13"
plugins = ["pydantic.mypy"]

strict = true

disallow_any_explicit = true
# disallow_any_expr = true
disallow_any_unimported = true
disallow_any_decorated = true

disallow_untyped_globals = true
warn_unreachable = true

enable_error_code = [
  "ignore-without-code", # Forces you to specify what error code you are ignoring (e.g. # type: ignore[attr-defined])
  "redundant-expr",      # Checks for pointless boolean expressions
  "truthy-bool",         # Warns when checking truthiness of a boolean (e.g. 'if x == True:')
  "redundant-self",      # Warns about redundant self/cls assignments
  "unused-awaitable",    # Warns if an awaitable is returned and not awaited
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["tqdm", "zstandard", "zstandard.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/dojo"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
  "@overload",
]
show_missing = true
fail_under = 100

[tool.vulture]
min_confidence = 80
paths = ["src"]
ignore_names = ["source_ast", "target_ast", "target_output"]
