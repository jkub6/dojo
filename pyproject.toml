[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dojo"
version = "0.1.0"
description = "Professional Ninja Build Generator for Static Site Generation"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  {name = "Jake", email = "jkub66@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
  "pyyaml",
  "pydantic>=2.0",
  "tqdm",
  "rich>=10.0.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "mypy",
  "types-PyYAML",
  "vulture",
]

[project.urls]
Homepage = "https://github.com/example/dojo"
Documentation = "https://github.com/example/dojo#readme"
Repository = "https://github.com/example/dojo.git"
Issues = "https://github.com/example/dojo/issues"

[project.scripts]
dojo = "dojo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dojo"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "--cov=src/dojo --cov-report=term-missing"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["yaml", "tqdm", "rich.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/dojo"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.vulture]
min_confidence = 80
paths = ["src"]
ignore_names = [
    "cls",
    "resolve_tool_paths",
    "validate_defaults_path",
    "validate_derived_output",
    "validate_custom_rules",
    "validate_src_dir",
    "validate_config",
]


