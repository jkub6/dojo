[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dojo"
version = "0.1.0"
description = "Professional Ninja Build Generator for Static Site Generation"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [
  {name = "Jake", email = "jkub66@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
  "pyyaml",
  "pydantic>=2.0",
  "tqdm",
  "rich>=10.0.0",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "mypy",
  "types-PyYAML",
  "vulture",
  "uv-secure"
]

[project.urls]
Homepage = "https://github.com/example/dojo"
Documentation = "https://github.com/example/dojo#readme"
Repository = "https://github.com/example/dojo.git"
Issues = "https://github.com/example/dojo/issues"

[project.scripts]
dojo = "dojo.cli:entry_point"

[tool.hatch.build.targets.wheel]
packages = ["src/dojo"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "F",      # Pyflakes (logic errors)
    "E",      # pycodestyle (style)
    "W",      # pycodestyle (warnings)
    "I",      # isort (imports)
    "N",      # pep8-naming (class/function names)
    "B",      # flake8-bugbear (likely bugs/design problems)
    "A",      # flake8-builtins (shadowing builtins)
    "C4",     # flake8-comprehensions (better list/dict comps)
    "DTZ",    # flake8-datetimez (require timezone-aware dates)
    "SIM",    # flake8-simplify (suggestions for simpler code)
    "T20",    # flake8-print (disallow print, prefer logging)
    "RUF",    # Ruff-specific rules
    "ERA",    # eradicate (ban commented out code)
    "PL",     # Pylint (static analysis)
    "S",      # Bandit (Security)
    "UP",     # pyupgrade (Modernize syntax)
    "D",      # pydocstyle (Docstrings)
    "PT",     # flake8-pytest-style (Test best practices)
    "C90",    # McCabe (Complexity check)
    # "ANN",    # Enforce Type Hints (Strict!)
    "TRY",    # Exception handling anti-patterns
    "BLE",    # Ban blind exceptions (except Exception:)
    "PERF",   # Performance anti-patterns
    "LOG",    # Logging best practices
    "RET",    # Return value consistency
    "TCH",    # Type-checking blocks (Move imports under IF TYPE_CHECKING)
    "ARG",    # Unused arguments (strict)
    "TID",    # flake8-tidy-imports
    "FBT", # Boolean trap
    "COM", # Trailing commas
    "G",   # Logging format
]
ignore = [
    "E501", # Line too long (handled by formatter)
    "D100", "D101", "D102", "D103", "D104", # Missing docstrings (enable gradually)
    "D203", # One blank line before class (conflicts with D211)
    "D213", # Multi-line docstring summary at second line (conflicts with D212)
    "COM812", # Trailing comma missing (conflicts with formatter)
    "ISC001", # Implicit string concatenation (conflicts with formatter)
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "S603", "PT011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "--cov=src/dojo --cov-report=term-missing"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = [
  "pydantic.mypy"
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["yaml", "tqdm", "rich.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/dojo"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true

[tool.vulture]
min_confidence = 80
paths = ["src"]
ignore_names = [
    "cls",
    "resolve_tool_paths",
    "validate_defaults_path",
    "validate_derived_output",
    "validate_custom_rules",
    "validate_src_dir",
    "validate_config",
]


